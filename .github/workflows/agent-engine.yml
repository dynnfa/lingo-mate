name: Agent engine
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-runtime:
    strategy:
      fail-fast: false
      matrix:
        runner:
          [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      LINGO_MATE_TEST_PACKAGED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13.3'
      - run: pnpm install --frozen-lockfile
      - run: pnpm agent:sync
      - run: pnpm agent:protocol
      - run: pnpm agent:test
      - run: pnpm agent:check
      - run: pnpm exec vitest run src/core/agent src/main/agent tests/integration/python-agent.test.ts
      - run: pnpm build
      - run: pnpm agent:build
      - run: pnpm agent:smoke
      - run: pnpm exec electron-builder --dir
      - if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm exec playwright test tests/e2e/python-agent.test.ts
      - if: runner.os != 'Linux'
        run: pnpm exec playwright test tests/e2e/python-agent.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-${{ matrix.runner }}
          path: agent-engine/dist/*.tar.gz
          if-no-files-found: error
